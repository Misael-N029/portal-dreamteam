# Portal DreamTeam · /etc/nginx/snippets/portal-headers.conf
# Cabeceras de seguridad comunes. Se incluyen en el servidor y en cada location que tenga add_header propio.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), payment=()" always;
# HSTS: el navegador usará siempre HTTPS (sin includeSubDomains: otros subdominios pueden seguir en HTTP)
add_header Strict-Transport-Security "max-age=31536000" always;
