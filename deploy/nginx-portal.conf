# Portal DreamTeam · /etc/nginx/sites-available/portal.dreamteam.com.pe
# Después de copiarlo: ln -s ../sites-available/portal.dreamteam.com.pe /etc/nginx/sites-enabled/
#                      cp deploy/nginx-portal-headers.conf /etc/nginx/snippets/portal-headers.conf
#                      nginx -t && systemctl reload nginx
#                      certbot --nginx -d portal.dreamteam.com.pe   (agrega HTTPS y la redirección)
#
# OJO en una actualización: certbot ya editó el archivo del servidor (bloque 443). No lo sobrescribas sin más:
# copia los cambios a mano o, si lo reemplazas, vuelve a ejecutar certbot --nginx -d portal.dreamteam.com.pe.

# Límite de intentos de ingreso por IP (además del bloqueo por cuenta del portal).
# Generoso porque toda la oficina sale por la misma IP: 60 por minuto con ráfagas de 120.
# Para no limitar la oficina, agrega su IP pública en el bloque geo con valor "".
geo $portal_login_key {
    default $binary_remote_addr;
    # 181.176.120.40 "";
}
limit_req_zone $portal_login_key zone=portal_login:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.dreamteam.com.pe;

    # Web compilada (npm run build)
    root /var/www/portal/web/dist;
    index index.html;

    # Fotos de DreamZone hasta 6 MB y archivos Excel del inventario
    client_max_body_size 6M;

    # Cabeceras de seguridad. Van en un snippet porque nginx NO hereda los add_header del servidor
    # en las location que declaran los suyos (antes /assets/ e index.html salían sin ellas).
    include snippets/portal-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml font/ttf font/otf;

    # Ingreso: con límite de intentos por IP
    location = /api/auth/login {
        limit_req zone=portal_login burst=120 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @login_limited {
        default_type application/json;
        include snippets/portal-headers.conf;
        return 429 '{"error":"Demasiados intentos de ingreso. Espera un momento y vuelve a intentar."}';
    }

    # API (Express en el puerto 4100, solo accesible desde este servidor).
    # X-Forwarded-For lleva la IP real: la usa la restricción por IP de la oficina.
    # ^~ evita que la regla de imágenes de abajo capture /api/files/*.jpg
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos de la web con nombre versionado: caché larga
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/portal-headers.conf;
    }

    # Fotos, logos y fuentes de /public (módulos, equipo, marcas): caché de 30 días
    location ~* \.(?:jpe?g|png|webp|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        include snippets/portal-headers.conf;
        try_files $uri =404;
    }

    # index.html sin caché, para que cada actualización se vea al instante
    location = /index.html {
        add_header Cache-Control "no-cache";
        include snippets/portal-headers.conf;
    }

    # Rutas de la app (/app, /admin/...): las resuelve React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
